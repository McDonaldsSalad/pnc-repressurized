name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Optional: helps if wrapper executable bit isn't preserved
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Java/Gradle info
        run: |
          java -version
          ./gradlew --version

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-libs
          path: build/libs/*.jar
          if-no-files-found: error
